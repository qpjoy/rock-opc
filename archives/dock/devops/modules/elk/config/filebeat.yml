filebeat.inputs:
  - type: filestream
    id: opc-sample-logs
    enabled: true
    paths:
      - /var/log/opc/*.log
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
    fields_under_root: true
    fields:
      service:
        name: opc-sample
      labels:
        environment: dev

  - type: filestream
    id: opc-demo-app-logs
    enabled: true
    paths:
      - /var/log/demo-app/*.ndjson
      - /var/log/demo-app/*.log
    parsers:
      - ndjson:
          target: ""
          add_error_key: true

processors:
  - add_host_metadata: {}
  - add_cloud_metadata: {}

output.logstash:
  hosts: ["logstash:5044"]

http:
  enabled: true
  host: 0.0.0.0
  port: 5066

logging.level: info
