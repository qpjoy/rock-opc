input {
  beats {
    port => 5044
  }

  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [service] and ![service][name] {
    mutate {
      rename => { "service" => "[service][name]" }
    }
  }

  if [level] and ![log][level] {
    mutate {
      rename => { "level" => "[log][level]" }
    }
  }

  if [env] and ![labels][environment] {
    mutate {
      add_field => { "[labels][environment]" => "%{env}" }
    }
  }

  if [duration_ms] and ![event][duration] {
    ruby {
      code => '
        value = event.get("duration_ms")
        if value
          event.set("[event][duration]", (value.to_f * 1_000_000).to_i)
        end
      '
    }
  }

  if [service][name] == "nginx" {
    mutate {
      add_tag => ["web", "edge"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "${ELASTIC_DATASET:opc}"
    data_stream_namespace => "${ELASTIC_NAMESPACE:default}"
  }

  stdout {
    codec => rubydebug
  }
}
