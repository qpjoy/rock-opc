input {
  file {
    path => "/data/import/*.csv"
    start_position => "beginning"
    mode => "read"
    sincedb_path => "/usr/share/logstash/data/plugins/inputs/file/movielens.sincedb"
    tags => ["movielens_import"]
  }
}

filter {
  if "movielens_import" in [tags] {
    csv {
      separator => ","
      columns => ["movieId", "title", "genres"]
      skip_header => true
    }

    mutate {
      convert => { "movieId" => "integer" }
      split => { "genres" => "|" }
      add_field => {
        "[service][name]" => "movielens-loader"
        "[event][category]" => "reference"
        "[event][dataset]" => "movielens"
        "[event][action]" => "catalog.import"
        "[event][outcome]" => "success"
        "[labels][demo_scenario]" => "movielens-import"
      }
      rename => {
        "movieId" => "[movie][id]"
        "genres" => "[movie][genres]"
      }
      remove_field => ["message", "path", "host"]
    }

    grok {
      match => {
        "title" => [
          "%{DATA:[movie][title]} \\(%{INT:[movie][year]}\\)",
          "%{GREEDYDATA:[movie][title]}"
        ]
      }
      tag_on_failure => []
    }

    mutate {
      convert => { "[movie][year]" => "integer" }
      strip => ["[movie][title]"]
    }
  }
}

output {
  if "movielens_import" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
      index => "movies"
      document_id => "%{[movie][id]}"
    }
  }
}
