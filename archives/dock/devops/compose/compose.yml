name: ${COMPOSE_PROJECT_NAME:-opc-devops}

x-opc-defaults: &opc-defaults
  restart: unless-stopped
  networks:
    - opc_devops
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-elastic-env: &elastic-env
  discovery.type: single-node
  xpack.security.enabled: "false"
  xpack.license.self_generated.type: basic
  ES_JAVA_OPTS: -Xms${ELASTICSEARCH_HEAP:-1g} -Xmx${ELASTICSEARCH_HEAP:-1g}
  TZ: ${TZ:-Asia/Shanghai}

services:
  elk-volume-init:
    <<: *opc-defaults
    profiles: ["elk", "full"]
    image: busybox:1.36
    user: root
    restart: "no"
    command:
      - sh
      - -ec
      - |
        mkdir -p /snapshots
        chown -R 1000:0 /snapshots
        chmod -R ug+rwX /snapshots
    volumes:
      - elasticsearch_snapshots:/snapshots

  nginx:
    <<: *opc-defaults
    profiles: ["gateway", "full"]
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ../modules/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../modules/nginx/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - kibana
      - grafana
      - jenkins

  elasticsearch:
    <<: *opc-defaults
    profiles: ["elk", "full"]
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.13.4}
    environment:
      <<: *elastic-env
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    depends_on:
      elk-volume-init:
        condition: service_completed_successfully
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - elasticsearch_snapshots:/usr/share/elasticsearch/snapshots
      - ../modules/elk/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro

  kibana:
    <<: *opc-defaults
    profiles: ["elk", "full"]
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.13.4}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_PUBLICBASEURL: http://localhost:${KIBANA_PORT:-5601}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    mem_limit: ${KIBANA_MEMORY_LIMIT:-1g}
    volumes:
      - ../modules/elk/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    <<: *opc-defaults
    profiles: ["elk", "full"]
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.13.4}
    environment:
      LS_JAVA_OPTS: -Xms${LOGSTASH_HEAP:-512m} -Xmx${LOGSTASH_HEAP:-512m}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${LOGSTASH_BEATS_PORT:-5044}:5044"
      - "${LOGSTASH_TCP_JSON_PORT:-5000}:5000"
    volumes:
      - ../modules/elk/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ../modules/elk/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    <<: *opc-defaults
    profiles: ["elk", "full"]
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.13.4}
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    ports:
      - "${FILEBEAT_HTTP_PORT:-5066}:5066"
    volumes:
      - ../modules/elk/config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../modules/elk/samples/logs:/var/log/opc:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      logstash:
        condition: service_started

  elk-setup:
    <<: *opc-defaults
    profiles: ["elk", "full"]
    image: node:20-alpine
    restart: "no"
    working_dir: /bootstrap
    command:
      - node
      - /bootstrap/1.bootstrap-elastic.js
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ILM_POLICY_NAME: opc-logs-policy
      ILM_POLICY_FILE: /assets/ilm-policy.json
      INDEX_TEMPLATE_NAME: opc-logs-template
      INDEX_TEMPLATE_FILE: /assets/index-template.json
      SNAPSHOT_REPOSITORY_NAME: opc_snapshots
      SNAPSHOT_REPOSITORY_FILE: /assets/snapshot-repository.json
    volumes:
      - ../modules/elk/assets:/assets:ro
      - ../modules/elk/node_specs:/bootstrap:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  elk-snapshot-scheduler:
    <<: *opc-defaults
    profiles: ["elk", "full"]
    image: curlimages/curl:8.7.1
    command:
      - /bin/sh
      - -ec
      - |
        es_url="$${ELASTICSEARCH_URL:-http://elasticsearch:9200}"
        repo="$${SNAPSHOT_REPOSITORY:-opc_snapshots}"
        interval="$${SNAPSHOT_INTERVAL_SECONDS:-86400}"
        retention="$${SNAPSHOT_RETENTION_COUNT:-7}"
        echo "[elk-snapshot-scheduler] waiting for elasticsearch at $${es_url}"
        until curl -fsS "$${es_url}/_cluster/health" >/dev/null 2>&1; do
          echo "[elk-snapshot-scheduler] elasticsearch not ready yet, retry in 5s"
          sleep 5
        done
        echo "[elk-snapshot-scheduler] elasticsearch is reachable, using repository $${repo}"
        while true; do
          snapshot_id="auto-$(date +%Y%m%d%H%M%S)"
          echo "[elk-snapshot-scheduler] creating snapshot $${snapshot_id}"
          if curl -fsS -X PUT "$${es_url}/_snapshot/$${repo}/$${snapshot_id}?wait_for_completion=true" >/dev/null; then
            echo "[elk-snapshot-scheduler] snapshot $${snapshot_id} created successfully"
            snapshots="$$(curl -fsS "$${es_url}/_cat/snapshots/$${repo}?h=id&s=id" || true)"
            count="$$(printf '%s\n' "$${snapshots}" | sed '/^$$/d' | wc -l | tr -d ' ')"
            echo "[elk-snapshot-scheduler] repository $${repo} currently has $${count} snapshots, retention=$${retention}"
            if [ "$${count}" -gt "$${retention}" ]; then
              delete_count=$$((count - retention))
              echo "[elk-snapshot-scheduler] pruning $${delete_count} old snapshots"
              printf '%s\n' "$${snapshots}" | sed '/^$$/d' | head -n "$${delete_count}" | while IFS= read -r old_snapshot_id; do
                [ -z "$${old_snapshot_id}" ] && continue
                echo "[elk-snapshot-scheduler] deleting snapshot $${old_snapshot_id}"
                if ! curl -fsS -X DELETE "$${es_url}/_snapshot/$${repo}/$${old_snapshot_id}" >/dev/null; then
                  echo "[elk-snapshot-scheduler] failed to delete snapshot $${old_snapshot_id}, will retry on next cycle"
                fi
              done
            fi
          else
            echo "[elk-snapshot-scheduler] snapshot $${snapshot_id} failed, likely repository permission or repository state issue; will retry after sleep"
          fi
          echo "[elk-snapshot-scheduler] sleeping $${interval}s before next run"
          sleep "$${interval}"
        done
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SNAPSHOT_REPOSITORY: opc_snapshots
      SNAPSHOT_INTERVAL_SECONDS: ${SNAPSHOT_INTERVAL_SECONDS:-86400}
      SNAPSHOT_RETENTION_COUNT: ${SNAPSHOT_RETENTION_COUNT:-7}
    depends_on:
      elk-setup:
        condition: service_completed_successfully

  prometheus:
    <<: *opc-defaults
    profiles: ["monitoring", "full"]
    image: prom/prometheus:v2.51.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../modules/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    <<: *opc-defaults
    profiles: ["monitoring", "full"]
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../modules/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  jenkins:
    <<: *opc-defaults
    profiles: ["cicd", "full"]
    image: jenkins/jenkins:lts-jdk17
    user: root
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ:-Asia/Shanghai}

  gitlab:
    <<: *opc-defaults
    profiles: ["scm", "full"]
    image: gitlab/gitlab-ce:17.0.1-ce.0
    hostname: ${GITLAB_HOST:-gitlab.local}
    shm_size: 256m
    ports:
      - "${GITLAB_HTTP_PORT:-8929}:8929"
      - "${GITLAB_HTTPS_PORT:-8443}:443"
      - "${GITLAB_SSH_PORT:-2224}:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${GITLAB_HOST:-gitlab.local}:${GITLAB_HTTP_PORT:-8929}'
        nginx['listen_port'] = ${GITLAB_HTTP_PORT:-8929}
        gitlab_rails['time_zone'] = '${TZ:-Asia/Shanghai}'
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab

networks:
  opc_devops:
    name: opc_devops
    driver: bridge

volumes:
  elasticsearch_data:
  elasticsearch_snapshots:
  filebeat_data:
  prometheus_data:
  grafana_data:
  jenkins_home:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  nginx_cache:
